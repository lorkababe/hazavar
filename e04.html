 A szerzetesek inkább imádkoznak, mint harcolnak.": "Close by, few guards. The monks would rather pray than fight.", "Gazdag piac, de fallal és lovagokkal.": "A rich market, but with walls and knights.", "Messze van, de a városok tele vannak arannyal. A hazaút hosszú.": "Far away, but the cities are full of gold. The way home is long.", "Csak megmutatjuk magunkat a határon, és fizetnek, hogy elmenjünk. Biztos, de kevés.": "We just show ourselves at the border and they pay us to leave. Safe, but small.", "A portya rajtaütésbe futott. Üres kézzel jöttek haza{0}.": "The raid ran into an ambush. They came home empty-handed{0}.", ", és odaveszett egy ló": ", and a horse was lost", "Hazaértek a portyázók!": "The raiders are home!", "Előbb tanuld ki a Portyázást a Kutatásban.": "First learn Raiding in Research.", "KALANDOZÁSOK": "RAIDS", "Merre portyázzunk?": "Where shall we raid?", "Egyszerre {0} portya lehet úton. Több Lovasíjász-tábor több portyát enged. Vigyázz, a csatában az a nép bukik nagyot, amelyik csak a zsákmányból él! Most a Pénzed {1}%-a zsákmányból jön.": "{0} raids can be out at once. More Horse Archer Camps allow more raids. Careful, in the great battle the people who live only from plunder fall hardest! Right now {1}% of your Money comes from plunder.", "Úton, még {0}.": "On the road, {0} left.", "Hazaértek! Nézzük, mit hoztak.": "They are back! Let us see what they brought.", "Fogadom őket": "Welcome them", "{0}% kockázat": "{0}% risk", "Kell": "Needs", "Hozhat": "May bring", "Indulás": "Ride out", "Rovás ábécé · {0} / {1} betű": "Runic alphabet · {0} / {1} letters", "A rovásos kövek a térképen bukkannak fel, mint a többi meglepetés. Ha összegyűlik tíz betű, megnyílik a Rovásos kő emlékmű.": "Rune stones appear on the map like other surprises. Collect ten letters and the Rune Stone monument unlocks.", "Kard vagy eke?": "Sword or plough?", "Bulcsú kalandozni hívja a fiatalokat, a gazdasszony szántani. Mindkettőnek igaza van, csak nem egyszerre.": "Bulcsú calls the young to raid, the farmer woman calls them to plough. Both are right, just not at the same time.", "Bulcsú": "Bulcsú", "„Nyugaton annyi az arany, hogy csak le kell hajolni érte! Minek túrni a földet, ha a szász úgyis fizet?”": "\"There is so much gold in the west, you only have to bend down for it! Why dig the soil when the Saxons pay anyway?\"", "+1 portya egyszerre, +30% zsákmány. De a zsákmánytól függő nép a csatában nagyot bukhat.": "+1 raid at a time, +30% plunder. But people who depend on plunder can fall hard in the battle.", "Bulcsúra hallgatok": "I listen to Bulcsú", "A gazdasszony": "The farmer woman", "„A zsákmány elfogy, a föld megmarad. Aki vet, az arat, aki portyázik, az előbb-utóbb pórul jár.”": "\"Plunder runs out, the land stays. Who sows, reaps. Who raids, sooner or later comes to grief.\"", "+25% Termény a Gazdatanyákon, +4 Hangulat. A kalandozás marad, csak nem lesz több belőle.": "+25% Food on Farmsteads, +4 Mood. Raiding stays, there just will not be more of it.", "A gazdasszonyra hallgatok": "I listen to the farmer woman", "Apám mindig mondta, hogy a legnehezebb döntés az, amikor mindkét tanácsadó jól beszél.": "My father always said the hardest decision is when both advisers speak well.", "Bulcsú vezeti a portyákat! Több kaland, több zsákmány.": "Bulcsú leads the raids! More adventure, more plunder.", "Szántunk és vetünk. A gazdatanyák bővebben teremnek.": "We plough and sow. The farmsteads yield more.", "A Duna mente": "Along the Danube", "Folyó, kereskedők, nyitott út nyugat felé.": "A river, merchants, an open road west.", "+10% Pénz minden korszakban": "+10% Money in every era", "A Tisza vidéke": "The Tisza region", "Végtelen legelők és termékeny föld.": "Endless pastures and fertile land.", "+10% Termény minden korszakban": "+10% Food in every era", "Erdély": "Transylvania", "Hegyek, sók, erdők, nehéz megtámadni.": "Mountains, salt, forests, hard to attack.", "+2 Védelem minden korszakban": "+2 Defense in every era", "ÚJ HAZA": "NEW HOMELAND", "Hol vertek gyökeret?": "Where will you put down roots?", "Ez az utolsó vándorlás. Ahová most letelepedtek, ott épül fel a városod a következő ezer évben. A választás egy kis állandó bónuszt ad.": "This is the last migration. Where you settle now, your city will grow for the next thousand years. The choice gives a small permanent bonus.", "Itt maradunk": "We stay here", "Új rovásbetű: {0}! ({1} / {2})": "New rune letter: {0}! ({1} / {2})", "Összegyűlt tíz betű! Az Építésben vár a Rovásos kő.": "Ten letters collected! The Rune Stone is waiting in Build.", "Rovásos kő": "Rune stone", "Emléktár": "Relic hall", "Az előző korszak emlékművei ide kerülnek, és állandó bónuszt adnak. Ha Etelközben építettél Vereckei-hágót vagy Vezéri jurtát, itt a helyük.": "Monuments of the previous era come here and give a permanent bonus. If you built the Verecke Pass or the Chieftain Yurt in Etelköz, this is their place.", "A 3. korszaktól, az állandó városban ki is rakhatod őket a térképre.": "From era 3, in the permanent city, you can place them on the map.", "portya": "raids", "rovásbetű": "rune letters", "Bulcsú megint mindent felrótt a rovásbotjára. Már három bot kell neki.": "Bulcsú carved everything onto his tally stick again. He needs three sticks by now.", "Erősítsd a védelmet Földvárral vagy Lovasíjász-táborral (most {0} a {1}-ből)": "Strengthen defense with an Earthwork Fort or a Horse Archer Camp (now {0} of {1})", "Kellenek még lovak, legalább 10 (most {0})": "You need more horses, at least 10 (now {0})", "Gyűjts még Terményt, most {0} van a 800-ból": "Gather more Food, you have {0} of 800", "A Pénzed {0}%-a zsákmányból jön. Termelj többet otthon, a Kovácsműhely és a Falu segít.": "{0}% of your Money comes from plunder. Produce more at home, the Smithy and the Village help.", "Jutalmul kaptatok 300 Pénzt és 5 Tudást": "Your reward is 300 Money and 5 Knowledge", "Megnyílt Lehel kürtje, keresd az Építésben!": "The Horn of Lehel is unlocked, find it in Build!", "A csatában odaveszett {0} Termény": "{0} Food was lost in the battle", "A vereség után egy épület romba dőlt ({0}), de újjá lehet építeni": "After the defeat a building fell to ruins ({0}), but it can be rebuilt", "Csata a Lech mezején": "Battle on the Lech field", "Német páncélos lovagok sorfala és magyar lovasíjászok a Lech folyó mentén, viharos ég alatt": "A line of armored German knights and Hungarian horse archers by the Lech river under a stormy sky", "szétszórnak minket": "they scatter us", "súlyos vereség lesz": "it will be a heavy defeat", "épphogy hazajutunk": "we barely make it home", "legendák születnek": "legends will be born", "Augsburg, 955": "Augsburg, 955", "I. Ottó német király hatalmas sereget gyűjtött, és Augsburg alatt vár ránk.": "King Otto I of Germany has gathered a huge army and waits for us at Augsburg.", "A csata {0} múlva kezdődik. Van egy teljes napod felkészülni. A zsákmánytól függő nép nagyot bukhat, ezt jegyezd meg!": "The battle begins in {0}. You have a full day to prepare. People who depend on plunder can fall hard, remember that!", "Árpád aggódva fürkészi a láthatárt": "Árpád scans the horizon, worried", "Ilyen sereggel még Ottó is meggondolja magát!": "With an army like this even Otto will think twice!", "Ha most csapunk össze, {0}. Nézd, ezek még sokat segítenének!": "If we clash now, {0}. Look, these would help a lot!", "Ottó lovagjai nem bírtak velünk, a sereg épen tért haza. Lehel kürtjéről még dalokat fognak írni!": "Otto's knights could not beat us, the army came home whole. They will write songs about the Horn of Lehel!", "Vereség lett, de a sereg nagy része hazajutott. Ideje kevesebbet portyázni és többet szántani.": "It was a defeat, but most of the army made it home. Time to raid less and plough more.", "Súlyos vereség. Sokan nem jöttek haza. A nép most már tudja, hogy a zsákmány nem tart örökké.": "A heavy defeat. Many did not come home. The people now know that plunder does not last forever.", "A sereg szétszóródott, a zsákmányból élő falvak üresen maradtak. Mostantól a földből kell élnünk.": "The army scattered, the villages that lived on plunder stood empty. From now on we must live off the land.", "A 2. KORSZAK VÉGE": "END OF ERA 2", "Megérkeztünk": "We have arrived", "Véget ért a vándorlás. A 3. korszak, az Államalapítás a prototípusban még nem játszható, ott már a városod a helyén marad. Maradhatsz, és építkezhetsz tovább.": "The wandering is over. Era 3, the Founding of the State, is not playable in the prototype yet, from there your city stays in place. You can stay and keep building.", "Árpád egy fehér lovat ad át egy elégedett szláv fejedelemnek a folyóparton": "Árpád hands a white horse to a delighted Slavic ruler by the river", "Honfoglalás, Kárpát-medence": "Conquest, Carpathian Basin", "895 körül a magyarok átkeltek a Kárpátokon. A monda szerint Árpád egy fehér lóért cserébe kapta meg az egész országot, és az eladó ezt csak utólag értette meg. Itt már nem vándorlunk, hanem letelepedünk, szántunk, és nyugatra kalandozunk. Csak vigyázz, ne a zsákmányból élj!": "Around 895 the Hungarians crossed the Carpathians. Legend says Árpád got the whole country in exchange for a white horse, and the seller only understood it afterwards. Here we no longer wander, we settle, plough and raid to the west. Just be careful not to live off plunder!", "Az Emléktárba került: {0}.": "Moved to the Relic hall: {0}.", "Az etelközi szállás öröksége {0} Pénz kezdőtőke.": "Your Etelköz camp leaves you {0} Money as a head start.", "Itt a haza, vitéz. Innentől nem költözünk, hanem építünk.": "This is home, warrior. From now on we do not move, we build.", "Vissza az 1. korszakba (teszt)": "Back to Era 1 (test)", "Pénz. Ebben a korban a nyereg alatt puhított hús számít pénznek. A monda szerint így puhították a húst. Valójában a ló sebes hátát védték vele, de ki hallgat a régészekre?": "Money. In this era, meat tenderized under the saddle counts as money. Legend says that is how they tenderized meat. In reality it protected the horse's sore back, but who listens to archaeologists?", "Pénz (nyereg alatti hús)": "Money (saddle meat)", "Pénz · nyereghús": "Money · saddle meat", "Elfelejtett nyereghús": "Forgotten saddle meat", "A rovásos kövek a szálláson kívül bukkannak fel. Ha nem akarsz várni, a táltos is megtaníthat egy betűt. Tíz betűnél megnyílik a Rovásos kő emlékmű.": "Rune stones appear outside the settlement. If you do not want to wait, the shaman can teach you a letter. With ten letters the Rune Stone monument unlocks.", "Megtanulok egy betűt": "Learn a letter", "Előbb tégy meg {0} portyát ({1} / {0}), a Kalandozás menüben": "First complete {0} raids ({1} / {0}) in the Raids menu", "Monda": "Legend", "Bizánc kapuja": "The Gate of Byzantium", "Botond útja. Messze van, de ez nem portya, hanem becsületbeli ügy.": "Botond's journey. It is far, but this is not a raid, it is a matter of honour.", "A fehér ló ára": "The price of the white horse", "Megjött Szvatopluk követe. A fejedelme utánaszámolt, és rájött, hogy egy lóért odaadta az egész országot. Most visszakérné, vagy legalább kérne mellé valamit.": "Svatopluk's envoy has arrived. His prince did the maths and realised he gave away the whole country for one horse. Now he wants it back, or at least something extra.", "Adunk mellé egy szép nyerget": "We add a nice saddle", "A követ boldogan ment haza a nyereggel. A fejedelme kevésbé lesz boldog.": "The envoy went home happy with the saddle. His prince will be less happy.", "Megmutatjuk neki az íjászokat": "We show him our archers", "Kell hozzá egy Lovasíjász-tábor": "Needs a Horse Archer Camp", "A követ megnézte az íjászokat, és hirtelen nagyon sietős lett a dolga. Még az ajándékát is itt felejtette.": "The envoy looked at the archers and was suddenly in a great hurry. He even left his gift behind.", "Botond buzogánya": "Botond's mace", "Bizánc nem akar adót fizetni. Botond, a legerősebb vitézünk azt mondja, ő majd elintézi, csak kell neki egy rendes buzogány. Építs Kovácsműhelyt!": "Byzantium refuses to pay tribute. Botond, our strongest warrior, says he will sort it out, he just needs a proper mace. Build a Smithy!", "Kész a buzogány, Botond két kézzel is alig bírja. Hosszú az út Bizáncig, gyűjts össze hat lovat!": "The mace is ready, Botond can barely lift it with both hands. It is a long way to Byzantium, gather six horses!", "Botond nyeregben ül. A Kalandozás menüben vár egy új cél, Bizánc kapuja. Indítsd útnak, hat óra alatt odaér!": "Botond is in the saddle. A new target waits in the Raids menu, the Gate of Byzantium. Send him off, he gets there in six hours!", "MONDA": "LEGEND", "Ára": "Price", "Ezt választom": "I choose this", "egy legenda": "a legend", "Még nincs kész": "Not done yet", "MONDA · VÉGE": "LEGEND · END", "Botond és a bizánci kapu": "Botond and the gate of Byzantium", "Botond egyetlen csapással akkora lyukat ütött a bizánci kapun, hogy egy ötéves gyerek átfért rajta. Aztán kiállt ellene egy óriás görög, és Botond azt is a földhöz vágta. A császár azóta nagyon udvarias velünk.": "With a single blow Botond knocked a hole in the gate of Byzantium big enough for a five-year-old child to climb through. Then a giant Greek stood up to him, and Botond threw him to the ground too. The emperor has been very polite to us ever since.", "és egy ajándék telek": "and a free plot of land", "A magyarok 959 körül valóban vezettek egy hadjáratot Bizánc ellen, de ez kudarccal végződött. Botond legendája csak a 14. századi krónikákban maradt fenn, és senki sem tudja, élt-e egyáltalán. A kapu valószínűleg ma is egyben van.": "Around 959 the Hungarians really did lead a campaign against Byzantium, but it ended in failure. The legend of Botond survives only in 14th-century chronicles, and nobody knows whether he ever lived. The gate is probably still in one piece.", "Hajrá, Botond!": "Go, Botond!", "Botond vagyok, a legerősebb vitéz ebben a táborban, kérdezz meg bárkit. Bizánc nem akar adót fizetni. Én majd elintézem, csak kell egy rendes buzogány. Építs Kovácsműhelyt!": "I am Botond, the strongest warrior in this camp, ask anyone. Byzantium refuses to pay tribute. I will sort it out, I just need a proper mace. Build a Smithy!", "Megvan a buzogány! A kovács szerint túl nehéz. Szerintem pont jó. Hosszú az út Bizáncig, gyűjts össze hat lovat!": "The mace is ready! The smith says it is too heavy. I say it is just right. It is a long way to Byzantium, gather six horses!", "Nyeregben vagyok! A Kalandozás menüben vár egy új cél, Bizánc kapuja. Indíts útnak, hat óra, és ott vagyok. Kopogni fogok.": "I am in the saddle! A new target waits in the Raids menu, the Gate of Byzantium. Send me off, six hours and I am there. I will knock.", "Kopogtam. Egyet. Akkora lyuk lett a bizánci kapun, hogy egy ötéves gyerek átfért rajta. Aztán kiállt ellenem egy óriás görög, őt is a földhöz vágtam. A császár azóta nagyon udvarias.": "I knocked. Once. The hole in the gate of Byzantium was big enough for a five-year-old to climb through. Then a giant Greek stood up to me, so I threw him to the ground too. The emperor has been very polite ever since.", "Turul": "Turul", "Begépelted a madár nevét.": "You typed the bird's name.", "Csodaszarvas": "Miraculous Stag", "Elkaptad a csodaszarvast. Majdnem.": "You caught the miraculous stag. Almost.", "Hét kattintás": "Seven clicks", "Hétszer bökted meg a kalauzt.": "You poked the guide seven times.", "Puhítás": "Tenderizing", "Ötször megbökted a Pénzt.": "You poked the Money five times.", "Nem eladó": "Not for sale", "Tízszer kattintottál a Koronára.": "You clicked the Crown ten times.", "Rokon?": "Related?", "Attilának hívnak.": "Your name is Attila.", "Bagoly": "Night owl", "Hajnalban is építkeztél.": "You were building before dawn.", "Rovásmester": "Rune master", "Rovással írtad, hogy hazavár.": "You wrote \"hazavár\" in runes.", "Titok felfedezve: {0}! ({1} / {2})": "Secret found: {0}! ({1} / {2})", "Titkok · {0} / {1}": "Secrets · {0} / {1}", "Átsuhant a turul a tábor felett!": "The turul swept over the camp!", "A Szent Korona nem eladó. Ezt még a Habsburgok is megtanulták.": "The Holy Crown is not for sale. Even the Habsburgs learned that.", "Vitéz, holnap is lesz nap.": "Warrior, there will be a tomorrow too.", "Attila? Rokon? Mindenki azt mondja, hogy rokon.": "Attila? Related? Everybody says they are related.", "A rovás még a szelet is megállítja.": "Runes can stop even the wind.", "A csodaszarvas elszaladt, de hagyott maga után valamit. +150 Pénz, +3 Tudás.": "The miraculous stag ran away, but left something behind. +150 Money, +3 Knowledge.", "Hét kattintás? Tíz falunként egy templomot kérek, nem hét kattintást.": "Seven clicks? I asked for one church per ten villages, not seven clicks.", "Puhul…": "Tenderizing…", "TITOK FELFEDEZVE": "SECRET FOUND", "Véget ért a vándorlás. Jön a 3. korszak, az Államalapítás, ahol a városod már végleg a helyén marad. Az emlékműveid veled jönnek.": "The wandering is over. Era 3 comes next, Founding the State, where your city stays in place for good. Your monuments come with you.", "Tovább a 3. korszakba": "On to Era 3", "Ugrás a 3. korszakba (teszt)": "Jump to Era 3 (test)", "3. korszak": "Era 3", "3. Államalapítás · Esztergom": "Era 3 · Founding the State · Esztergom", "István, a kalauz": "István, the guide", "István sóhajt": "István sighs", "Pénz. István verette az első magyar pénzt, az ezüst dénárt. Végre olyan pénz, amit nem kell megetetni.": "Money. István minted the first Hungarian coin, the silver denar. Finally money you do not have to feed.", "Pénz (dénár)": "Money (denar)", "Pénz · dénár": "Money · denar", "Só, a korszak kincse. Erdélyből hozzák, és a király minden szemét megszámolja.": "Salt, the treasure of this era. It comes from Transylvania, and the king counts every grain.", "Só": "Salt", "Só · Kincs": "Salt · Treasure", "Eggyel több törvény lehet érvényben.": "One more law can be in force.", "Út": "Road", "Ez a kulcskutatás. Utána jön a nagy próba!": "This is the key research. The great trial comes right after!", "{0}. szint · +{1}% Pénz mindenhol": "level {0} · +{1}% Money everywhere", "A fehér ló": "The White Horse", "Lehel kürtje": "Horn of Lehel", "Keresztények ({0}%) {1} / 100 · Pogányok ({2}%) {3} / 100": "Christians ({0}%) {1} / 100 · Pagans ({2}%) {3} / 100", "Templom és kolostor a keresztényeknek, szent liget a pogányoknak. Ha az egyik fél nagyon elégedetlen, abból baj lesz.": "Churches and monasteries for the Christians, sacred groves for the pagans. If one side gets very unhappy, there will be trouble.", "Tíz falu, egy templom": "One church per ten villages", "Minden tíz falu építsen templomot. A térítés gyorsul, a keresztények örülnek, a pogányok morognak.": "Every ten villages must build a church. Conversion speeds up, Christians rejoice, pagans grumble.", "Vasárnapi munkatilalom": "No work on Sundays", "Vasárnap senki nem dolgozik. A keresztények boldogok, a Termény 8%-kal kevesebb.": "Nobody works on Sunday. Christians are happy, Food is 8% less.", "A tized": "The tithe", "A termés tizede az egyházé. A kolostorok kétszer annyi Tudást adnak, de a Pénzből 5% elfogy.": "A tenth of the harvest goes to the church. Monasteries give twice the Knowledge, but 5% of the Money disappears.", "Ispánok kinevezése": "Appointing reeves", "Minden megyébe ispán kerül. +3 Védelem, de a nép nem szereti az új urakat.": "Every county gets a reeve. +3 Defense, but people do not like the new lords.", "Vendégek befogadása": "Welcoming guests", "Az egynyelvű ország gyenge, írta István. A külföldi mesterek +10% Pénzt hoznak.": "A country of one language is weak, wrote István. Foreign craftsmen bring +10% Money.", "Pogány szokások tilalma": "Ban on pagan customs", "Tilos a régi áldozat. A térítés nagyon gyorsul, a pogányok nagyon morognak.": "The old sacrifices are forbidden. Conversion speeds up a lot, pagans grumble a lot.", "A régi szokások tisztelete": "Respect for old customs", "A régi ünnepeket meg lehet tartani. A pogányok örülnek, a térítés lassul.": "The old feasts may be kept. Pagans are happy, conversion slows.", "TÖRVÉNYEK": "LAWS", "István törvénykönyve": "István's law book", "Egyszerre {0} törvény lehet érvényben. Egy törvény kihirdetése 50 Pénz, a visszavonása ingyen van.": "{0} laws can be in force at once. Proclaiming a law costs 50 Money, revoking it is free.", "Térítés · a nép {0}%-a keresztény": "Conversion · {0}% of the people are Christian", "Keresztények {0} / 100 · Pogányok {1} / 100 · óránként {2}{3}% térítés": "Christians {0} / 100 · Pagans {1} / 100 · {2}{3}% conversion per hour", "érvényben": "in force", "Visszavonom": "Revoke", "Kihirdetem": "Proclaim", "Kihirdetve · {0}": "Proclaimed: {0}", "ÚT-DÖNTÉS": "CROSSROADS", "Milyen gyorsan térítünk?": "How fast do we convert?", "Gyorsan": "Fast", "Lassan": "Slowly", "Templomot minden faluba, keresztet minden nyakba. A térítés majdnem kétszer olyan gyors.": "A church in every village, a cross on every neck. Conversion is almost twice as fast.", "A pogányok nem fogják szó nélkül hagyni. Koppány már fenyegetőzik.": "The pagans will not take it quietly. Koppány is already making threats.", "Majd megtérnek maguktól. Az unokáik biztosan. A térítés jóval lassabb.": "They will convert on their own. Their grandchildren surely will. Conversion is much slower.", "A nyugati szomszédok és a pápa türelmetlenek lesznek. Lehet, hogy segítséget küldenek, akár akarjuk, akár nem.": "The western neighbours and the pope will get impatient. They may send help, whether we want it or not.", "Gyors térítés. Koppány fülébe is eljutott.": "Fast conversion. Koppány heard about it too.", "Lassú térítés. Bajorországban már csóválják a fejüket.": "Slow conversion. In Bavaria they are already shaking their heads.", "Koppány egy sziklán állva kürtöt emel, mögötte lovasok sziluettje": "Koppány stands on a rock raising a horn, riders silhouetted behind him", "KOPPÁNY-FELKELÉS": "KOPPÁNY'S REVOLT", "Koppány nem hagyja annyiban": "Koppány will not let it go", "A régi törvény szerint a legidősebb rokoné a trón, vagyis az enyém. Az özvegy is jár hozzá. Kereszt helyett kardot kérek.": "By the old law the throne goes to the eldest kinsman, which is me. The widow comes with it. I want a sword, not a cross.", "Leverem a lázadást": "I crush the revolt", "Kell hozzá legalább {0} Védelem, most {1} van. A térítés nagyot lép, és Hírnevet kapsz.": "You need at least {0} Defense, you have {1}. Conversion jumps ahead and you gain Fame.", "Csatába!": "To battle!", "Megegyezem vele": "I make a deal", "200 Pénzért Koppány hazamegy. A pogányok hálásak, a térítés visszaesik.": "For 200 Money Koppány goes home. Pagans are grateful, conversion drops back.", "Alkudjunk": "Let us bargain", "Még gondolkodom": "Let me think", "Koppány vár. Két óra múlva újra jelentkezik.": "Koppány waits. He will be back in two hours.", "Koppány elvitte a pénzt, és megígérte, hogy nem jön vissza. Majdnem el is hittük.": "Koppány took the money and promised not to come back. We almost believed him.", "A lázadás elbukott": "The revolt failed", "Koppány seregét Veszprém alatt verték szét. A térítés nagyot lépett előre, kaptál 10 Hírnevet.": "Koppány's army was crushed near Veszprém. Conversion jumped ahead, you got 10 Fame.", "Koppány somogyi vezér 997-ben fellázadt István ellen. A régi szokás szerint ő lett volna Géza örököse, mint a család legidősebb férfitagja. Veszprém mellett vereséget szenvedett, a testét felnégyelték, és elrettentésül négy vár kapujára tűzték ki.": "Koppány, lord of Somogy, rebelled against István in 997. By the old custom he would have been Géza's heir as the eldest man of the family. He was defeated near Veszprém, his body was quartered and nailed to the gates of four castles as a warning.", "NYUGATI NYOMÁS": "PRESSURE FROM THE WEST", "Bajor lovagok a kapuban": "Bavarian knights at the gate", "Gizella bátyja, a bajor herceg úgy gondolja, túl lassan térítünk. Küldött pár lovagot és papot. Segíteni. Akár akarjuk, akár nem.": "Gizella's brother, the Duke of Bavaria, thinks we convert too slowly. He sent a few knights and priests. To help. Whether we want it or not.", "Befogadom őket": "I welcome them", "+3 Védelem és gyorsabb térítés, de a pogányok kevésbé lesznek elégedettek.": "+3 Defense and faster conversion, but the pagans will be less happy.", "Jöjjenek": "Let them come", "Udvariasan hazaküldöm": "I politely send them home", "150 Pénzbe kerül az ajándék, amivel hazamennek.": "The farewell gift costs 150 Money.", "Köszönjük, nem": "Thanks, no", "A bajor lovagok beköltöztek. Mindegyik páncélban alszik.": "The Bavarian knights moved in. Each of them sleeps in armour.", "A lovagok hazamentek. A papok közül kettő itt maradt, mert tetszik nekik a pálinka.": "The knights went home. Two of the priests stayed because they like the pálinka.", "Ajtony és a só": "Ajtony and the salt", "A Maros mentén Ajtony úr minden sószekeret megállít, és elveszi a vámot. A só a királyé, Ajtony szerint viszont a folyó az övé, és a szekér is azon megy át.": "Along the Maros, Lord Ajtony stops every salt cart and takes a toll. The salt belongs to the king, but Ajtony says the river is his, and the cart crosses it.", "Kifizetem a vámot": "I pay the toll", "Ajtony megköszönte, és szólt, hogy jövő héten duplán kéri.": "Ajtony thanked you and said next week it will be double.", "Nem fizetek egy dénárt sem": "Not a single denar", "Ajtony megsértődött. Ez még nem a vége.": "Ajtony is offended. This is not over.", "Ha Ajtony nem enged, erő kell. Tanuld ki a Vármegyéket, és építs egy Ispánsági várat. Csanád vezér már be is költözne.": "If Ajtony will not yield, we need force. Learn Counties and build a County Castle. Commander Csanád would move right in.", "Csanád szerint a sereg sóval jobban harcol. Nem tudom, miért, de gyűjts hat szekér sót.": "Csanád says the army fights better with salt. I do not know why, but gather six carts of salt.", "Csanád készen áll. Négy szekér sót és 150 Pénzt kér az útra, és hat óra múlva Marosvárnál lesz.": "Csanád is ready. He asks for four carts of salt and 150 Money for the road, and in six hours he will be at Marosvár.", "Küldöm Csanádot": "Send Csanád", "Csanád útnak indult a Maros felé.": "Csanád set off towards the Maros.", "Csanád úton van. Még {0}, és Marosvárnál lesz.": "Csanád is on the road. {0} more and he reaches Marosvár.", "Megjött a hír Marosvárról!": "News from Marosvár!", "Egy kövér vezér sótömbökön ülve megállít egy sószekeret a folyó gázlójánál": "A fat chieftain sitting on salt blocks stops a salt cart at a river ford", "Csanád és Ajtony": "Csanád and Ajtony", "Csanád legyőzte Ajtonyt, és Marosvárat azóta róla hívják Csanádnak. A só újra szabadon jön. Ajtony vámszedőit pedig átképeztük, most a királynak szedik a vámot.": "Csanád defeated Ajtony, and Marosvár has been called Csanád after him ever since. The salt flows freely again. We retrained Ajtony's toll collectors, now they collect for the king.", "Ajtony a Maros vidékének ura volt, és tényleg megvámolta a király sószállítmányait, amelyek Erdélyből a Maroson úsztak le. István serege Csanád vezetésével 1028 körül legyőzte, Marosvárat pedig a győztesről nevezték el Csanádnak. Innen ered Csanád vármegye neve is.": "Ajtony ruled the Maros region and really did tax the king's salt shipments floating down the Maros from Transylvania. István's army, led by Csanád, defeated him around 1028, and Marosvár was renamed Csanád after the victor. That is where the name of Csanád county comes from.", "Éljen Csanád!": "Long live Csanád!", "Rovás vagy latin betű?": "Runes or Latin letters?", "Az öreg táltos szerint a rovás a mienk, és ezer éve jól működik. Asztrik apát szerint latinul ír az egész világ, és a pápa is csak azt tudja elolvasni.": "The old shaman says runes are ours and have worked fine for a thousand years. Abbot Asztrik says the whole world writes in Latin, and the pope can only read that.", "Az öreg táltos": "The old shaman", "„A rovást a kőbe véstük, a latint csak hártyára írják. Melyik marad meg tovább?”": "\"We carve runes in stone, Latin is only written on parchment. Which one will last longer?\"", "+4 Hangulat a pogányoknak, +2 mindenkinek. A térítés nem gyorsul.": "+4 Mood for pagans, +2 for everyone. Conversion does not speed up.", "Maradjon a rovás": "Keep the runes", "Asztrik apát": "Abbot Asztrik", "„Latinul írnak a királyok, a törvények és a számlák. Főleg a számlák.”": "\"Kings, laws and bills are written in Latin. Mostly the bills.\"", "A kolostorok másfélszer annyi Tudást adnak, és a térítés is gyorsul.": "Monasteries give one and a half times the Knowledge, and conversion speeds up.", "Jöjjön a latin": "Bring the Latin", "Én latinul tanultam. De az anyámtól rovást kaptam karácsonyra. Nehéz ez.": "I learned Latin. But my mother gave me runes for Christmas. It is hard.", "Marad a rovás. A táltos elégedetten bólint, az apát sóhajt.": "The runes stay. The shaman nods, the abbot sighs.", "Jön a latin. Asztrik apát boldog, a táltos morogva elteszi a rovásbotját.": "Latin it is. Abbot Asztrik is happy, the shaman grumbles and puts away his rune stick.", "Tudtad? A rovásírás a Székelyföldön évszázadokig tovább élt, a 17. században is használták.": "Did you know? Runic writing survived in Székely Land for centuries and was still used in the 17th century.", "Döntök": "Decide", "Megvan a királyság. Most már csak meg kell tartani, ami a nehezebb rész.": "The kingdom stands. Now we just have to keep it, which is the harder part.", "Szépen halad a királyság. Imádkozom, hogy így maradjon.": "The kingdom is doing nicely. I pray it stays that way.", "Törvények": "Laws", "0 / 2 érvényben": "0 / 2 in force", "{0} / {1} érvényben": "{0} / {1} in force", "Fektess {0} Hírnevet Pannonhalmába": "Invest {0} Fame in Pannonhalma", "Elgurult dénár": "A rolling denar", "Vándor szerzetes": "A wandering monk", "Elhagyott erszény": "An abandoned purse", "Leesett sótömb": "A fallen salt block", "Magától gyűlik, öt percenként 1, és az Erőpróbák is adnak belőle. Pannonhalmát lehet vele szintezni.": "Gathers by itself, 1 every five minutes, and Trials give some too. You can level up Pannonhalma with it.", "Pannonhalma elérte a(z) {0}. szintet! Erősebb lett.": "Pannonhalma reached level {0}! It got stronger.", "Az Építés menü Emléktár fülén ki is rakhatod őket a térképre, ingyen.": "You can place them on the map for free from the Relic hall tab of the Build menu.", "Az előző korszakok emlékművei ide kerülnek, és állandó bónuszt adnak. Ha volt Vereckei-hágód, Vezéri jurtád, fehér lovad vagy Lehel kürtöd, itt a helyük.": "Monuments of previous eras come here and give a permanent bonus. If you had the Verecke Pass, the Chieftain Yurt, the White Horse or the Horn of Lehel, this is their place.", "törvény": "laws", "térítés": "conversion", "Asztrik apát mindent leírt latinul. Senki nem tudja elolvasni, de nagyon szép.": "Abbot Asztrik wrote everything down in Latin. Nobody can read it, but it looks lovely.", "Erősítsd a védelmet Ispánsági várral (most {0} a {1}-ből)": "Strengthen defense with a County Castle (now {0} of {1})", "A keresztények elégedetlenebbek. Építs templomot vagy kolostort.": "The Christians are less happy. Build a church or a monastery.", "A pogányok elégedetlenebbek. Építs szent ligetet, vagy vonj vissza egy szigorú törvényt.": "The pagans are less happy. Build a sacred grove or revoke a strict law.", "Tölts meg a kincstárat, most {0} Pénz van az 1500-ból": "Fill the treasury, you have {0} Money of 1500", "Legyen legalább két érvényes törvényed. A Törvények menüben hirdetheted ki őket.": "Have at least two laws in force. You can proclaim them in the Laws menu.", "Jutalmul kaptatok 400 Pénzt és 5 Tudást": "Your reward is 400 Money and 5 Knowledge", "Megnyílt a Koronázási palást, keresd az Építésben!": "The Coronation Mantle is unlocked, find it in Build!", "A trónviszályban odaveszett {0} Termény": "{0} Food was lost in the succession struggle", "A zavargásokban egy épület romba dőlt ({0}), de újjá lehet építeni": "A building fell to ruins in the unrest ({0}), but it can be rebuilt", "Ki lesz a király?": "Who will be king?", "Üres trón gyertyafényben, rajta a korona, előtte háttal a fáradt király": "An empty throne in candlelight with the crown on it, the tired king in front of it seen from behind", "széthullik az ország": "the country falls apart", "évekig tartó trónviszály jön": "years of strife are coming", "épphogy egyben marad a királyság": "the kingdom barely holds together", "nyugodtan alhatunk": "we can sleep in peace", "Imre herceg halála, 1031": "The death of Prince Imre, 1031", "Imre herceg vadászaton meghalt. István örökös nélkül maradt, és a rokonok már gyülekeznek.": "Prince Imre died on a hunt. István is left without an heir, and the relatives are already gathering.", "{0} múlva dől el, ki lesz a következő király. Erős várak, nyugodt nép, teli kincstár és érvényes törvények kellenek.": "In {0} it will be decided who the next king is. You need strong castles, calm people, a full treasury and laws in force.", "István gondterhelten": "István, troubled", "Ilyen rendben hagyni az országot, azt még a pápa is megirigyelné.": "Leaving the country in such order, even the pope would envy it.", "Ha most kellene dönteni, {0}. Nézd, ezek még sokat segítenének!": "If it had to be decided now, {0}. Look, these would help a lot!", "Az ország egyben maradt, a nép nyugodt, a kincstár tele. Gizella hálából hímeztetett egy palástot.": "The country held together, the people are calm, the treasury full. Gizella had a mantle embroidered out of gratitude.", "Akadt néhány rokon, aki túl hangosan kérdezte, ki lesz a király, de a rend megmaradt.": "A few relatives asked a bit too loudly who would be king, but order held.", "Zavargások voltak, és pár vár gazdát cserélt. A királyság megmaradt, de sebekkel.": "There was unrest and a few castles changed hands. The kingdom survived, but scarred.", "A rokonok egymásnak estek. A királyság megmaradt, de évekig tartott, mire mindenki megnyugodott.": "The relatives turned on each other. The kingdom survived, but it took years for everyone to calm down.", "A 3. KORSZAK VÉGE": "END OF ERA 3", "Megszületett a királyság": "The kingdom is born", "István 1038-ban meghalt, de a királyság megmaradt. A 4. korszak, az Árpád-házi királyok kora a prototípusban még nem játszható. A városod itt marad, építkezhetsz tovább.": "István died in 1038, but the kingdom survived. Era 4, the age of the Árpád kings, is not playable in the prototype yet. Your city stays, you can keep building.", "Maradok a városban": "I stay in the city", "István térdel egy kőtemplomban, a feje fölé felülről egy korona ereszkedik": "István kneels in a stone church as a crown descends toward his head from above", "Államalapítás, Esztergom": "Founding the State, Esztergom", "Az ezredforduló körül Géza fia, István királlyá koronáztatta magát, a hagyomány szerint a pápától kapott koronával. A város mostantól a helyén marad, és ezer évig épül tovább. A nép egy része keresztény, a nagyobb része a régi hitet követi, és mindkét fél figyel. Neked kell egyensúlyban tartani őket, miközben dénárt versz, sót szállítasz és törvényeket hozol.": "Around the year 1000 Géza's son István had himself crowned king, by tradition with a crown sent by the pope. From now on the city stays where it is and keeps growing for a thousand years. Part of the people are Christian, the larger part follow the old faith, and both sides are watching. You must keep them in balance while you mint denars, carry salt and make laws.", "A honfoglaló szállás öröksége {0} Pénz kezdőtőke.": "Your conquest-era settlement leaves you {0} Money as a head start.", "Az emlékműveid megérkeztek. Az Építés menü Emléktár fülén ingyen kirakhatod őket.": "Your monuments have arrived. You can place them for free from the Relic hall tab in Build.", "Csörög.": "Jingle.", "Vissza a 2. korszakba (teszt)": "Back to Era 2 (test)", "Terület": "Land", "Új terület": "New land", "Egy 3×4-es telek a város szélén. Ajándékba, Pénzért vagy Koronáért lehet a tiéd, és ugyanúgy építhetsz rá, mint bárhová máshová.": "A 3×3 plot at the edge of town. You can get it as a gift, for Money or for Crowns, and build on it like anywhere else.", "{0} szabad terület · {1} ajándék": "{0} free plots · {1} gifts", "Minden terület a tiéd": "All the land is yours", "Válassz egy szabad területet a térképen, koppints a + jelre.": "Pick a free plot on the map, tap the + sign.", "Ez nem szabad terület. Koppints a + jelre.": "That is not a free plot. Tap a + sign.", "3×3": "3×3", "szabad terület bővítéshez az Építés menüben": "free plots for expansion in the Build menu", "Az első ingyenes!": "The first one is free!", "Most nem tudsz területet venni. Kell egy ajándék telek, elég Pénz vagy elég Korona.": "You cannot get land right now. You need a gift plot, enough Money or enough Crowns.", "Most nem vehető": "Not available now", "Az Áldozóhelyek kétszer annyi Tudást adnak.": "Offering Places give twice the Knowledge.", "Az Életfa-oszlopok +4 Hangulatot adnak.": "Tree of Life Poles give +4 Mood.", "Húzd végig az ujjad vagy az egered a mezőkön, és ösvény lesz belőle. Ha egy meglévő ösvényről indulsz, azt törlöd, és visszakapod az árát. Ha végeztél, nyomd meg a Kész gombot.": "Drag your finger or mouse across the tiles to lay a path. Start on an existing path to erase it and get its price back. When you are done, press Done.", "Az előző korszakban megszerzett telkeidért {0} ajándék telket kaptál. Az Építés menü Terület fülén rakhatod le őket.": "For the plots you owned in the previous era you got {0} gift plots. Place them from the Land tab in the Build menu.", "Nincs elég szabad ember, {0} kellene. Építs még egy Földházat vagy Falut!": "Not enough free people, {0} needed. Build another Pit House or Village!", "Nincs elég szabad ember, {0} kellene. Építs még egy Parasztházat vagy Falut!": "Not enough free people, {0} needed. Build another Farmhouse or Village!", "Az Áldozóhely és a fehér ló javít rajta, sok új lakos ront rajta.": "Offering Places and the White Horse improve it, many new residents lower it.", "Tovább az 1. korszakba": "On to Era 1", "Tovább a 2. korszakba": "On to Era 2", "Ez a korszak kész. Amikor készen állsz, innen léphetsz tovább.": "This era is complete. When you are ready, move on from here.", "A 4. korszak, az Árpád-házi királyok kora hamarosan jön. Addig építkezhetsz tovább.": "Era 4, the age of the Árpád kings, is coming soon. Until then you can keep building.", "Tele volt a raktár, a felesleges Terményt eladtuk a vásáron: +{0} Pénz": "The storage was full, the surplus Food was sold at the market: +{0} Money"};
const EN_DATA = {"res": {"penz": "Money", "termeny": "Food", "tudas": "Knowledge", "kovako": "Salt", "hirnev": "Fame"}, "def": {"fo": ["Royal Manor", "A stone hall with a timber upper floor and a chapel beside it. István rules from here when he is not praying."], "haz": ["Farmhouse", "A simple thatched house. The tenant may be Christian or pagan, what matters is that they pay taxes."], "falu": ["Village", "Houses on stone footings, a shared oven, chickens. One church will be due for every ten of these."], "szanto": ["Ploughland", "Furrows, wheat and an ox plough. The land is the king's now, the work is yours."], "soraktar": ["Salt Store", "Transylvanian salt arrives here. Salt is royal treasure, and whoever steals it is in trouble."], "penzverde": ["Mint", "Denars are struck here. They read LANCEA REGIS, the king's lance, because nobody can draw the crown yet."], "piac": ["Market", "Salt, pottery, cloth and gossip. A market lifts the mood better than a sermon."], "templom": ["Village Church", "A stone church with a wooden belfry. It calms the Christians and wakes the pagans on Sunday morning."], "liget": ["Sacred Grove", "Ribboned oaks, a carved post, a fire pit. This is the church of the old faith, and there is no tithe."], "kolostor": ["Benedictine Monastery", "The monks write, read and keep bees. They give Knowledge and make the Christians happy."], "ispan": ["County Castle", "An earth rampart, a palisade and a stone tower. The reeve sits here and collects what the king asks."], "verem": ["Grain Pit", "A grain pit dug into the ground. +500 room for Food."], "vezeri": ["Pannonhalma Abbey", "Great Monument. Géza began it and István finished it around 996. It will still stand a thousand years later, which is rare in this era. Level it up with Fame."], "lehel": ["Coronation Mantle", "Glorious reward. Queen Gizella had it embroidered in 1031, originally as a chasuble. It still exists."], "r_verecke": ["Verecke Pass", "From the Relic hall. This is where you came into the Carpathian Basin, a whole people on one narrow path."], "r_jurta": ["Chieftain Yurt", "From the Relic hall. The yurt of old times. Pagans love looking at it, monks less so."], "r_feherlo": ["The White Horse", "From the Relic hall. We got the country for this horse. The horse is gone, but the statue looks good."], "r_kurt": ["Horn of Lehel", "From the Relic hall. The legendary horn. Nobody blows it, because nobody knows what happens next."], "ut": ["Road", "A paved road. People take it from the manor to the church, or to the grove, depending."]}, "cats": {"telek": "Land", "all": "All", "lak": "Homes", "term": "Production", "hang": "Mood", "ved": "Defense", "emlek": "Relic hall", "ut": "Road"}, "tech": {"falu": "Village Order", "templom": "Arrival of Missionaries", "piac": "Market Rights", "denar": "Minting", "bences": "Benedictine Order", "torveny": "István's Laws", "varmegye": "Counties", "apatsag": "Founding the Abbey", "imre": "The Question of the Heir"}, "quests": ["Welcome to the manor! From now on we do not move, the city stays here for a thousand years. Build a Farmhouse and lead a road to it.", "We need bread. Lay out a Ploughland, you can turn it with the Rotate button.", "Collect the harvest three times. The tithe comes later, enjoy it until then.", "Salt is royal treasure. Build a Salt Store and gather three carts of salt.", "Part of the people are Christian, the rest follow the old faith. Learn Arrival of Missionaries, build a church, but a sacred grove too. Both sides are watching.", "We must decide how fast we convert. Fast, and the pagans rebel. Slowly, and the western neighbours grow impatient.", "The old shaman and Abbot Asztrik are arguing again. Runes or Latin letters? Call the Council!", "A kingdom needs laws. Open the Laws menu and proclaim a law.", "Let us be seventy! Many people pay many taxes. The monks did the maths.", "My father began it, I must finish it. Learn Founding the Abbey and start building Pannonhalma!", "My son Imre will be kin // zsákmány: mindig van benne pénz, mellé véletlenszerűen egy-három másik dolog abból, ami ebben a korban létezik
function raidLoot(type) {
  const L = { penz: amt(rnd(40, 110)) };
  const pool = Object.keys(RES).filter(k => !['penz', 'tudas', 'hirnev'].includes(k));
  const prod = type && DEF[type] && DEF[type].prod ? Object.keys(DEF[type].prod).find(k => pool.includes(k)) : null;
  const size = k => k === 'termeny' ? amt(rnd(30, 90)) : k === 'fa' ? rnd(12, 28) : k === 'kovako' ? rnd(1, 2) : RES[k] && RES[k].raw ? rnd(8, 18) : RES[k] && RES[k].good ? rnd(4, 10) : rnd(2, 6);
  const picks = []; if (prod) picks.push(prod);
  const goods = pool.filter(k => RES[k] && RES[k].good); if (goods.length) { const g1 = pick(goods); if (!picks.includes(g1)) picks.push(g1); }
  const extra = rnd(2, 3); for (let t = 0; t < 12 && picks.length < extra + (prod ? 1 : 0); t++) { const k = pick(pool); if (!picks.includes(k)) picks.push(k); }
  picks.forEach(k => { L[k] = (L[k] || 0) + size(k); });
  if (Math.random() < 0.15) L.tudas = rnd(1, 2);
  return L;
}

    if (OK_WORDS.some(o => l.includes(o))) return w;
    if (BAD.some(b => l.includes(b))) { hit = true; return w.length <= 2 ? w[0] + '*' : w[0] + '*'.repeat(w.length - 2) + w[w.length - 1]; } return w; });
  return { text: out, hit };
}

// ---------- időzített események ----------
function later(ev, ms) { SOC.offers = SOC.offers || []; SOC.queue = SOC.queue || []; SOC.queue.push(Object.assign(ev, { at: NOW() + ms })); saveSoc(); }
function runQueue() {
  const q = SOC.queue || []; const due = q.filter(e => e.at <= NOW()); if (!due.length) return false;
  SOC.queue = q.filter(e => e.at > NOW());
  due.forEach(ev => {
    const b = bot(ev.from); if (!b && ev.type !== 'coupEnd' && ev.type !== 'snitchPay' && ev.type !== 'kardEnd') return;
    if (ev.type === 'thanks') SOC.wall.unshift({ from: b.id, text: pick(['Köszönöm a kalákát, szomszéd!', 'Na, ezt nem felejtem el. Jó értelemben.', 'Ha bármi kell, szólj. Kivéve lovat.']), t: NOW() });
    if (ev.type === 'reply') SOC.wall.unshift({ from: b.id, text: pick(['Megkaptam az üzeneted. Rovásbotra is felírtam.', 'Erről majd a lakomán beszélünk.', 'Ezt most dicséretnek vagy fenyegetésnek vegyem?']), t: NOW() });
    if (ev.type === 'angry') SOC.wall.unshift({ from: b.id, text: pick(ANGRY), t: NOW() });
    if (ev.type === 'gift') { const r = pick([{ penz: amt(40) }, { termeny: amt(40) }, { kovako: 1 }]); giveR(r); log(TF('{0} ajándékot küldött: {1}', b.name, resTxt(r)), 'ajandek'); toast(TF('{0} ajándékot küldött! {1}', b.name, resTxt(r))); }
    if (ev.type === 'revenge') botRaidsMe(b, false);
    if (ev.type === 'revenge2') botRaidsMe(b, true);
    if (ev.type === 'snitchPay') { const r = { penz: ev.n }; giveR(r); log(TF('Titkos fizetség érkezett: {0}. Senki nem tudja, honnan.', resTxt(r)), 'kincstar'); toast(TF('Megjött a titkos részed: {0}', resTxt(r)));
      if (Math.random() < 0.3) { kitAward('spicli'); log(T('Lebuktál! A törzs rájött, hogy te adtad el a kapukulcsot.'), 'szavazas'); if (SOC.ally) SOC.ally.members.forEach(m => { const x = bot(m); if (x) x.friend -= 4; }); } }
    if (ev.type === 'coupEnd') coupResolve();
    if (ev.type === 'kardEnd') kardEnd();

}
function botRaidsMe(b, betrayed) {
  const d = dly(); if (d.raidedMe && !betrayed) return; const m = myDef() - (betrayed ? allyDef() : 0);
  const chance = betrayed ? 0.9 : Math.max(0.1, Math.min(0.7, b.def / (b.def + Math.max(1, m))));
  if (Math.random() > chance) { log(TF('{0} rád portyázott, de az őreid visszaverték.', b.name), 'portya'); return; }
  d.raidedMe = 1; const lost = Math.min(Math.floor((S.res.penz || 0) * 0.05), amt(40)); S.res.penz -= lost;
  log(TF('{0} kifosztott! Elvittek {1} Pénzt.', b.name, lost) + (betrayed ? ' ' + T('Valaki beárult! A portyázó pontosan tudta, hol nincs őrség.') : ''), 'portya');
  toast(betrayed ? T('Valaki beárult! A portyázó pontosan tudta, hol nincs őrség.') : TF('{0} kifosztott! -{1} Pénz', b.name, lost));
  pushNote(betrayed ? T('Beárultak!') : T('Kifosztottak!'), betrayed ? T('Valaki beárult! A portyázó pontosan tudta, hol nincs őrség.') : TF('{0} kifosztott! -{1} Pénz', b.name, lost), 'portya');
  if (betrayed && SOC.ally) { SOC.ally.suspect = { culprit: SOC.ally.secretSnitch || pick(SOC.ally.members.filter(x => x !== 'me')), until: NOW() + DAY }; delete SOC.ally.secretSnitch; }
}
function tick() {
  if (!SOC) return; let changed = runQueue();
  const steps = Math.min(6, Math.floor((NOW() - (SOC.lastTick || NOW())) / (10 * 60e3)));
  for (let s = 0; s < steps; s++) { changed = true; stepWorld(); }
  if (steps) SOC.lastTick = (SOC.lastTick || NOW()) + steps * 10 * 60e3; if (NOW() - SOC.lastTick > HOUR) SOC.lastTick = NOW();
  if (changed) { commit(); refresh(); }
  badge();
}
function stepWorld() {
  const r = Math.random(); const b = pick(SOC.bots.filter(x => !x.real)); if (!b) return;
  if (r < 0.10) { SOC.wall.unshift({ from: b.id, text: pick(WALLS), t: NOW() }); SOC.wall = SOC.wall.slice(0, 30); }
  else if (r < 0.18) { const x = { penz: amt(8) }; giveR(x); log(TF('{0} kalákázott nálad. {1}', b.name, resTxt(x)), 'kalaka'); }
  else if (r < 0.22 && b.friend > 1) { const x = pick([{ penz: amt(30) }, { termeny: amt(30) }]); giveR(x); log(TF('{0} ajándékot küldött: {1}', b.name, resTxt(x)), 'ajandek'); }
  else if (r < 0.25 && !inAlly(b.id)) botRaidsMe(b, false);
  const A = SOC.ally; if (A) {
    A.members.filter(m => m !== 'me').forEach(m => { A.treasury += Math.round(rnd(4, 14) * ERA_F * (A.aldomas ? 1.1 : 1)); });
    if (A.leader !== 'me' && A.treasury >= goal() && !A.kard) launchCampaign(true);
    if (A.treasury > 250 && Math.random() < 0.01) botBetrays();
    else if (A.leader === 'me' && !A.coup && A.members.length > 2 && Math.random() < 0.012) botCoup();
    else if (!A.secretSnitch && !A.suspect && A.members.length > 2 && Math.random() < 0.01) { A.secretSnitch = pick(A.members.filter(x => x !== 'me')); const outsider = pick(SOC.bots.filter(x => !inAlly(x.id))); if (outsider) later({ type: 'revenge2', from: outsider.id }, rnd(20, 120) * 60e3); }
    if (A.aldomas && A.aldomasAt && NOW() - A.aldomasAt > 3 * DAY) kitAward('aldomas');
    if (!A.offerAt || NOW() - A.offerAt > DAY) { if (Math.random() < 0.08 && A.members.length > 2) offerSnitch(); }
  }
}

    if (!A || (A.next && now >= A.next)) ask();
  }
  // ha zárva volt a játék, és közben éjszaka lett, az a rész éjszakai műszaknak számít
  function fromAway() {
    if (S.night || !seenPrev) return; const gap = lastNightIn(seenPrev, Date.now());
    if (gap && gap[1] - gap[0] >= 45 * 60e3) { startNight(gap[0]); S.night.e = gap[2]; save(); }
  }

  // ---- rajz: kékes sötét, csak a műhelyekben pislákol a fény ----
  const _draw = draw;
  draw = function (now) {
    _draw(now);
    const want = S && S.night ? 1 : 0; nA += (want - nA) * 0.035; if (Math.abs(want - nA) < 0.002) nA = want; if (nA <= 0) return;
    try { paintNight(now, nA); } catch (e) {}
  };
  function paintNight(now, a) {
    const c = ctx; c.save(); c.setTransform(DPR, 0, 0, DPR, 0, 0);
    c.globalCompositeOperation = 'multiply'; c.fillStyle = `rgba(${Math.round(255 - 205 * a)},${Math.round(255 - 180 * a)},${Math.round(255 - 95 * a)},1)`; c.fillRect(0, 0, W, H);
    c.globalCompositeOperation = 'source-over'; c.fillStyle = `rgba(8,14,40,${0.22 * a})`; c.fillRect(0, 0, W, H);
    // holdfény a jobb felső sarokból
    let g = c.createRadialGradient(W * 0.88, H * 0.04, 0, W * 0.88, H * 0.04, Math.max(W, H) * 0.75);
    g.addColorStop(0, `rgba(150,175,235,${0.16 * a})`); g.addColorStop(1, 'rgba(150,175,235,0)');
    c.globalCompositeOperation = 'screen'; c.fillStyle = g; c.fillRect(0, 0, W, H);
    // meleg fény a dolgozó épületekben
    c.globalCompositeOperation = 'lighter';
    S.buildings.forEach(b => {
      const d = DEF[b.type]; if (!d || !d.prod || d.pop || !working(b)) return; const r = spriteRect(b); if (!r) return;
      const x = ((r.L[0] + r.R[0]) / 2 - camX) * scale, y = (r.y + r.h * 0.62 - camY) * scale, R = Math.max(18, r.w * scale * 0.42);
      if (x < -R || y < -R || x > W + R || y > H + R) return;
      const fl = 0.82 + 0.1 * Math.sin(now / 190 + b.id * 1.7) + 0.06 * Math.sin(now / 67 + b.id * 3.1);
      const gg = c.createRadialGradient(x, y, 0, x, y, R);
      gg.addColorStop(0, `rgba(255,170,80,${0.30 * a * fl})`); gg.addColorStop(0.35, `rgba(240,120,50,${0.14 * a * fl})`); gg.addColorStop(1, 'rgba(200,90,40,0)');
      c.fillStyle = gg; c.beginPath(); c.ellipse(x, y, R, R * 0.7, 0, 0, Math.PI * 2); c.fill();
    });
    // a képernyő széle sötétebb
    c.globalCompositeOperation = 'source-over';
    g = c.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
    g.addColorStop(0, 'rgba(5,10,30,0)'); g.addColorStop(1, `rgba(5,10,30,${0.35 * a})`); c.fillStyle = g; c.fillRect(0, 0, W, H);
    c.restore();
  }

  // éjjel nem lehet 10 percenként beszedni: az épületek alszanak, reggel jön minden egyben
  const _ready = ready; ready = function (b) { return S && S.night ? false : _ready(b); };

  // ---- felület ----
  const st = document.createElement('style');
  st.textContent = `.hvn .samu-say{margin:6px 0 12px}.hvn .samu-say img{width:120px;height:132px}
  .hvn-box{border-radius:14px;padding:10px 12px;margin:10px 0;background:rgba(255,248,232,.55);border:2px solid rgba(110,68,34,.18)}.hvn-box p{margin:4px 0 6px}
  .hvn-box.good{background:rgba(212,233,190,.6);border-color:rgba(70,120,50,.3)}.hvn-box.bad{background:rgba(240,214,196,.65);border-color:rgba(160,80,50,.3)}
  .hvn-chips{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:6px}.hvn-chip{display:inline-flex;align-items:center;gap:5px;font-weight:800}.hvn-chip img{width:24px;height:24px;object-fit:contain}.hvn-chip.neg{color:#9A3A22}
  #hvnBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(118px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px);padding:9px 10px 9px 16px;border-radius:999px;background:rgba(16,24,58,.86);color:#E6ECFF;font-weight:700;font-size:14px;box-shadow:0 6px 22px rgba(0,0,0,.35);border:1px solid rgba(160,180,255,.25)}
  #hvnBar button{border:0;border-radius:999px;padding:7px 14px;font:inherit;font-weight:800;background:#E8C46A;color:#2A1A08;cursor:pointer;white-space:nowrap}
  #hvnDev{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));top:calc(var(--toph,72px) + 120px);z-index:6;display:flex;flex-direction:column;gap:6px}
  #hvnDev button{border:2px dashed rgba(60,40,20,.5);border-radius:10px;padding:5px 9px;font:12px/1.2 inherit;font-weight:800;background:#F6E7C4;color:#3A2410;cursor:pointer}`;
  document.head.appendChild(st);
  const bar = document.createElement('div'); bar.id = 'hvnBar'; bar.hidden = true; document.body.appendChild(bar);
  function renderBar() {
    const on = !!(S && S.night); if (!on) { bar.hidden = true; return; }
    if (bar.hidden || !bar.firstChild) { bar.innerHTML = `<span>${tr('Psszt, mindenki alszik. Reggel 7-kor beszedheted az éjszakai termést.')}</span><button type="button">${tr('Ébresztő!')}</button>`; bar.querySelector('button').onclick = () => morning(true); }
    bar.hidden = false;
  }
  if (NDEV) {
    const dv = document.createElement('div'); dv.id = 'hvnDev';
    dv.innerHTML = `<button type="button" id="hvnT1">Teszt · Éjszaka / Reggel</button><button type="button" id="hvnT2">Teszt · Esti kérdés</button>`;
    document.body.appendChild(dv);
    $('hvnT1').onclick = () => { if (S.night) { S.night.test = true; morning(false); } else startNight(Date.now(), true); };
    $('hvnT2').onclick = () => { if (S.night) return; if (openModal) closeModal(); ask(); };
  }

  // ---- sarokjelzés, mint a Forge-ban: ha van mit beszedni, megmutatja, hol ----
  const rdy = document.createElement('button'); rdy.id = 'hvnReady'; rdy.type = 'button'; rdy.hidden = true; document.body.appendChild(rdy);
  const st2 = document.createElement('style');
  st2.textContent = `#hvnReady{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(270px + env(safe-area-inset-bottom,0px));z-index:6;width:66px;height:66px;border-radius:50%;border:4px solid #F5C542;background:#FFF4DF;box-shadow:0 6px 18px rgba(40,20,5,.35);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;animation:hvnBob 2.4s ease-in-out infinite}
  #hvnReady img{width:42px;height:42px;object-fit:contain;pointer-events:none}#hvnReady[hidden]{display:none}
  #hvnReady b{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:#C9472F;color:#fff;font:800 13px/24px Nunito,sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.3)}
  #hvnReady span{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);white-space:nowrap;font:800 11px Nunito,sans-serif;color:#FFF4DF;text-shadow:0 1px 3px rgba(0,0,0,.8)}
  @keyframes hvnBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}`;
  document.head.appendChild(st2);
  let rIdx = 0, focus = null, pan = null, rSig = '';
  const readyList = () => S.buildings.filter(b => { try { return DEF[b.type] && DEF[b.type].prod && ready(b) && !(typeof storeFull === 'function' && storeFull(b)); } catch (e) { return false; } });
  const ctr = b => { const r = spriteRect(b); if (!r) return null; return [r.cx != null ? r.cx : (r.L[0] + r.R[0]) / 2, r.y + r.h * 0.55]; };
  function updReady() {
    const list = S && !S.night && !(typeof tool !== 'undefined' && tool) ? readyList() : [];
    if (!list.length) { rdy.hidden = true; rSig = ''; return; }
    const k = Object.keys(DEF[list[0].type].prod)[0], im = (typeof IMG !== 'undefined' && IMG[RES[k] && RES[k].icon]) || null, src = im ? im.src : 'img/' + (RES[k] && RES[k].icon) + '.png';
    const sig = list.length + '|' + src; if (sig !== rSig) { rSig = sig; rdy.innerHTML = `<img src="${src}" alt=""><b>${list.length}</b><span>${tr('Beszedhető')}</span>`; rdy.title = tr('Van mit beszedni! Koppints, és megmutatom, hol.'); }
    rdy.hidden = false;
  }
  rdy.onclick = () => {
    const list = readyList(); if (!list.length) return; const b = list[rIdx++ % list.length], c = ctr(b); if (!c) return;
    const fx = camX + W / scale / 2, fy = camY + H / scale / 2; pan = { fx, fy, tx: c[0], ty: c[1], t0: performance.now() }; focus = { id: b.id, t0: performance.now() };
  };
  const _draw2 = draw;
  draw = function (now) {
    if (pan) { const k = Math.min(1, (performance.now() - pan.t0) / 450), e = 1 - Math.pow(1 - k, 3); centerOn(pan.fx + (pan.tx - pan.fx) * e, pan.fy + (pan.ty - pan.fy) * e); if (k >= 1) pan = null; }
    _draw2(now);
    if (focus) { const age = performance.now() - focus.t0, b = S.buildings.find(x => x.id === focus.id); if (age > 2600 || !b) { focus = null; return; }
      const c = ctr(b); if (!c) return; const x = (c[0] - camX) * scale, y = (c[1] - camY) * scale, R = (60 + 14 * Math.sin(age / 140)) * Math.max(0.6, scale);
      ctx.save(); ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.globalAlpha = Math.min(1, (2600 - age) / 600); ctx.lineWidth = 5; ctx.strokeStyle = '#F5C542'; ctx.shadowColor = 'rgba(255,230,150,.9)'; ctx.shadowBlur = 14; ctx.beginPath(); ctx.ellipse(x, y, R * 1.25, R * 0.75, 0, 0, 7); ctx.stroke(); ctx.restore(); }
  };
  setInterval(() => { try { updReady(); } catch (e) {} }, 1000);

  try { fromAway(); } catch (e) {}
  markSeen(); renderBar();
  setInterval(() => { try { check(); } catch (e) {} }, 15000);
  setTimeout(() => { try { check(); } catch (e) {} }, 4000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) markSeen(); else setTimeout(() => { try { check(); } catch (e) {} }, 800); });
  addEventListener('pagehide', markSeen);
})();
/*SOCIAL-END*/
})();
</script>
